baseURL = 'https://shawnbot.org/'
languageCode = 'en-us'
title = 'shawnbot.org'
theme = 'book'
disableKinds = ['RSS']

[params]
  # Follow the OS color scheme (baseof pins data-theme="light" by default,
  # which would disable the theme's prefers-color-scheme dark palette)
  BookTheme = 'auto'
  # Pagefind (Task 3) replaces the theme's built-in fuse search
  BookSearch = false
  BookToC = true
  BookSection = '*'

[menu]
  # menu.before renders above the section tree in the sidebar (menu.after
  # put Search at the bottom of the list)
  [[menu.before]]
    name = "Search"
    url = "/search/"
    weight = 1
